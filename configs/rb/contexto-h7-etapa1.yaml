# Etapa 1 de 2 (emenda P25, 03/11/2026; scripts/revisao_banca/etapas.py): cópia de contexto-h7.yaml com só
# as famílias da etapa 1. Mesmo name e root_seed: mesmos ids, instâncias, perguntas e caderno de respostas
# do run completo. Run parcial e descritivo; a análise confirmatória final é a do run completo.
name: contexto-h7
root_seed: 20261103
output_root: results_rb
sources:
  table: data_rb/etapas/contexto-h7-etapa1-sources.csv
  csv_dir: data_rb/contexto_h7/csv
  roles: [confirm]
  sentinel_exclusions: data_rb/sentinel_exclusions.csv
inject:
  n_grid: [1000]
  k_grid: [2, 8]
  rate_grid: [0.1, 0.3, 0.5]
  beta_grid: [1, 2, 4, 8, .inf]
  directions: [lower, upper, both]
  driver_rules: [maxcorr, random]
  max_base_attempts: 20
features:
  n_jobs: 8
